<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minions Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #1E90FF;
            font-size: 3rem;
            text-shadow: 2px 2px 0 #fff;
            margin-bottom: 30px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .minion-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s;
        }

        .minion-card:hover {
            transform: scale(1.05) rotate(3deg);
        }

        .minion-card h3 {
            color: #FF8C00;
            margin-top: 15px;
            font-size: 1.5rem;
        }

        .minion-card p {
            color: #666;
            margin-top: 10px;
        }

        /* Animation */
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-20deg); }
        }

        .waving {
            animation: wave 1s infinite;
            transform-origin: bottom center;
        }

        .blinking svg {
            animation: blink 4s infinite;
            transform-origin: center;
        }

        /* Background decorations */
        .bg-decoration {
            position: fixed;
            font-size: 5rem;
            opacity: 0.3;
            z-index: -1;
        }

        .banana { top: 10%; left: 5%; }
        .star { top: 20%; right: 10%; }
    </style>
</head>
<body>
    <div class="bg-decoration banana">🍌</div>
    <div class="bg-decoration star">⭐</div>

    <h1>👯 Minions Gallery 👯</h1>

    <div class="gallery">
        <!-- Single Minion -->
        <div class="minion-card">
            <svg width="150" height="220" viewBox="0 0 150 220">
                <!-- Body -->
                <ellipse cx="75" cy="130" rx="55" ry="80" fill="#F5E050" stroke="#333" stroke-width="2"/>
                
                <!-- Overalls -->
                <path d="M30 130 Q30 200 75 200 Q120 200 120 130 Q120 110 75 110 Q30 110 30 130" 
                      fill="#1E90FF" stroke="#333" stroke-width="2"/>
                <rect x="60" y="130" width="30" height="15" fill="#FFD700"/>
                
                <!-- Goggle Strap -->
                <rect x="10" y="65" width="130" height="12" rx="5" fill="#333"/>
                
                <!-- Goggle -->
                <circle cx="75" cy="70" r="35" fill="#888" stroke="#333" stroke-width="3"/>
                <circle cx="75" cy="70" r="28" fill="#EEE"/>
                <circle cx="75" cy="70" r="18" fill="#4A2511"/>
                <circle cx="75" cy="70" r="8" fill="#000"/>
                <circle cx="78" cy="67" r="3" fill="#FFF"/>
                
                <!-- Mouth -->
                <path d="M55 100 Q75 115 95 100" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
                
                <!-- eyebrows -->
                <path d="M45 50 Q60 40 75 50" fill="none" stroke="#333" stroke-width="3"/>
                <path d="M75 50 Q90 40 105 50" fill="none" stroke="#333" stroke-width="3"/>
                
                <!-- Arms -->
                <path d="M20 110 Q5 130 20 150" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
                <circle cx="20" cy="155" r="10" fill="#333"/>
                
                <!-- Teeth -->
                <rect x="65" y="108" width="6" height="8" fill="white"/>
                <rect x="79" y="108" width="6" height="8" fill="white"/>
            </svg>
            <h3>Kevin</h3>
            <p>The leader & tallest</p>
        </div>

        <!-- Blinking Minion -->
        <div class="minion-card blinking">
            <svg width="150" height="220" viewBox="0 0 150 220">
                <!-- Body -->
                <ellipse cx="75" cy="130" rx="55" ry="80" fill="#E8D430" stroke="#333" stroke-width="2"/>
                
                <!-- Overalls -->
                <path d="M30 130 Q30 200 75 200 Q120 200 120 130 Q120 110 75 110 Q30 110 30 130" 
                      fill="#228B22" stroke="#333" stroke-width="2"/>
                <rect x="60" y="130" width="30" height="15" fill="#FFD700"/>
                
                <!-- Goggle Strap -->
                <rect x="10" y="65" width="130" height="12" rx="5" fill="#333"/>
                
                <!-- Goggle (with closed eye) -->
                <circle cx="75" cy="70" r="35" fill="#888" stroke="#333" stroke-width="3"/>
                <circle cx="75" cy="70" r="28" fill="#4A2511"/>
                <line x1="50" y1="70" x2="100" y2="70" stroke="#333" stroke-width="4"/>
                
                <!-- Mouth - smile -->
                <path d="M55 100 Q75 120 95 100" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
                
                <!-- Hair -->
                <path d="M65 50 Q65 30 60 25" stroke="#333" stroke-width="3"/>
                <path d="M75 50 Q75 25 75 20" stroke="#333" stroke-width="3"/>
                <path d="M85 50 Q85 30 90 25" stroke="#333" stroke-width="3"/>
                
                <!-- Arms -->
                <path d="M130 110 Q145 130 130 150" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
                <circle cx="130" cy="155" r="10" fill="#333"/>
            </svg>
            <h3>Bob</h3>
            <p>The cute one with one eye</p>
        </div>

        <!-- Waving Minion -->
        <div class="minion-card waving">
            <svg width="150" height="220" viewBox="0 0 150 220">
                <!-- Body -->
                <ellipse cx="75" cy="130" rx="55" ry="80" fill="#FFD700" stroke="#333" stroke-width="2"/>
                
                <!-- Overalls -->
                <path d="M30 130 Q30 200 75 200 Q120 200 120 130 Q120 110 75 110 Q30 110 30 130" 
                      fill="#FF4500" stroke="#333" stroke-width="2"/>
                <rect x="60" y="130" width="30" height="15" fill="#FFD700"/>
                
                <!-- Goggle Strap -->
                <rect x="10" y="65" width="130" height="12" rx="5" fill="#333"/>
                
                <!-- Goggle -->
                <circle cx="75" cy="70" r="35" fill="#888" stroke="#333" stroke-width="3"/>
                <circle cx="60" cy="70" r="22" fill="#EEE"/>
                <circle cx="60" cy="70" r="12" fill="#4A2511"/>
                <circle cx="60" cy="70" r="5" fill="#000"/>
                <circle cx="90" cy="70" r="22" fill="#EEE"/>
                <circle cx="90" cy="70" r="12" fill="#4A2511"/>
                <circle cx="90" cy="70" r="5" fill="#000"/>
                
                <!-- Excited Mouth -->
                <ellipse cx="75" cy="105" rx="15" ry="10" fill="#333"/>
                
                <!-- Arms - one waving -->
                <path d="M130 110 Q160 80 145 50" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
                <circle cx="145" cy="45" r="12" fill="#333"/>
                <path d="M135 40 L155 40" stroke="#333" stroke-width="4"/>
                <path d="M137 35 L155 35" stroke="#333" stroke-width="4"/>
                <path d="M140 30 L155 30" stroke="#333" stroke-width="4"/>
            </svg>
            <h3>Stuart</h3>
            <p>The musician & evil leader</p>
        </div>
    </div>

    <!-- Fun interactive section -->
    <div style="text-align: center; margin-top: 50px;">
        <button onclick="alert('Me want banana! 🍌')" 
                style="padding: 15px 30px; font-size: 1.5rem; background: #FFD700; border: none; 
                       border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #B8860B;">
            Click for a Surprise!
        </button>
    </div>
</body>
</html>
