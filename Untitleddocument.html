<!DOCTYPE html>
<html>
<head>
<style>
    .minion {
        width: 120px;
        height: 180px;
        background: linear-gradient(to bottom, #FFE135 60%, #1E90FF 60%);
        border-radius: 60px 60px 40px 40px;
        position: relative;
        margin: 50px auto;
    }
    
    /* Goggle strap */
    .minion::before {
        content: '';
        position: absolute;
        width: 140px;
        height: 12px;
        background: #333;
        top: 50px;
        left: -10px;
        z-index: -1;
    }
    
    /* Goggle */
    .goggle {
        width: 80px;
        height: 80px;
        background: linear-gradient(to bottom, #666 20%, #eee 20%, #eee 80%, #333 80%);
        border-radius: 50%;
        position: absolute;
        top: 15px;
        left: 20px;
    }
    
    /* Eye */
    .eye {
        width: 40px;
        height: 40px;
        background: white;
        border-radius: 50%;
        position: absolute;
        top: 20px;
        left: 20px;
    }
    
    .pupil {
        width: 20px;
        height: 20px;
        background: #4A2511;
        border-radius: 50%;
        position: absolute;
        top: 10px;
        left: 10px;
    }
    
    /* Mouth */
    .mouth {
        width: 40px;
        height: 15px;
        border-bottom: 4px solid #333;
        border-radius: 50%;
        position: absolute;
        top: 100px;
        left: 40px;
    }
    
    /* Arms */
    .arm {
        width: 20px;
        height: 50px;
        background: #333;
        position: absolute;
        top: 70px;
        border-radius: 10px;
    }
    
    .arm.left { left: -15px; transform: rotate(20deg); }
    .arm.right { right: -15px; transform: rotate(-20deg); }
    
    /* Glove */
    .glove {
        width: 25px;
        height: 25px;
        background: #333;
        border-radius: 50%;
        position: absolute;
        bottom: -5px;
    }
</style>
</head>
<body>
    <div class="minion">
        <div class="goggle">
            <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="mouth"></div>
        <div class="arm left"><div class="glove"></div></div>
        <div class="arm right"><div class="glove"></div></div>
    </div>
</body>
</html>
